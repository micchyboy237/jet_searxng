# settings.yml
# Optimized for local LLM agent / RAG – Mac M1 – No Docker – Unlimited – July 2026

use_default_settings: true # Recommended: loads all defaults + your overrides

general:
  debug: false
  instance_name: "Local SearXNG ∞ (M1)"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

brand:
  new_issue_url: https://github.com/searxng/searxng/issues/new
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues

search:
  safe_search: 0
  autocomplete: "" # or "duckduckgo" / "brave" if preferred
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 300 # 5 minutes instead of 24h
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 300
  formats:
    - html
    - json # Essential for LLM agents

server:
  port: 8888
  bind_address: "0.0.0.0"
  base_url: "http://0.0.0.0:8888/"
  secret_key: "c1f3a9b8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0"
  limiter: false # completely off for local unlimited use
  public_instance: false
  image_proxy: true # highly recommended locally
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer
  proxied: true

cache:
  type: redis

valkey:
  url: redis://localhost:6379/0

ui:
  static_path: ""
  templates_path: ""
  query_in_title: true
  infinite_scroll: true
  default_theme: simple
  center_alignment: false
  default_locale: ""
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

outgoing:
  request_timeout: 4.0
  max_request_timeout: 12.0 # Added: helps stubborn engines
  useragent_suffix: "SearXNG-Local-M1-Agent"
  pool_connections: 150 # Slightly reduced from 200 for stability
  pool_maxsize: 40
  enable_http2: true
  proxies: {}
  extra_proxy_timeout: 10

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

checker:
  off_when_debug: true

categories_as_tabs:
  general:
  images:
  videos:
  news:
  science:
  files:
  music:
  it:
  social media:

# ——————————————————————— ENGINES ———————————————————————
# Only the best, truly unlimited or very high-limit engines enabled
# Ordered by reliability & speed in 2025

engines:
  # ────── CORE GENERAL WEB (fast fallback chain) ──────
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    timeout: 3.0
    weight: 15
    time_range_support: true
    paging: true
    categories: [general, web]
  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false
    timeout: 3.5
    weight: 10
    categories: [general, web]
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

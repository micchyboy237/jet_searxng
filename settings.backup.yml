# ~/.config/searxng/settings.yml
# Fully optimized local instance – Mac M1 – No Docker – No Limits – Nov 2025

general:
  debug: false
  instance_name: "Local SearXNG ∞ (M1)"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

brand:
  new_issue_url: https://github.com/searxng/searxng/issues/new
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: "127.0.0.1"
  base_url: "http://127.0.0.1:8888/"
  secret_key: "replace-this-with-random-32-chars-in-production!!"
  limiter: false # completely off for local unlimited use
  public_instance: false
  image_proxy: true # highly recommended locally
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  url: false # we use Redis instead (started via brew services)

ui:
  static_path: ""
  templates_path: ""
  query_in_title: true
  infinite_scroll: true
  default_theme: simple
  center_alignment: false
  default_locale: ""
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

outgoing:
  request_timeout: 4.0
  useragent_suffix: "SearXNG-Local-M1"
  pool_connections: 200
  pool_maxsize: 40
  enable_http2: true
  proxies: {}
  extra_proxy_timeout: 10.0

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

checker:
  off_when_debug: true

categories_as_tabs:
  general:
  images:
  videos:
  news:
  science:
  files:
  music:
  it:
  social media:

# ——————————————————————— ENGINES ———————————————————————
# Only the best, truly unlimited or very high-limit engines enabled
# Ordered by reliability & speed in 2025

engines:
  # Truly unlimited + best quality
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    time_range_support: true
    paging: true
    categories: [general, web]

  - name: brave.images
    engine: brave
    network: brave
    shortcut: bri
    disabled: false
    brave_category: images
    categories: [images, web]

  - name: brave.videos
    engine: brave
    network: brave
    shortcut: brv
    disabled: false
    brave_category: videos
    categories: [videos, web]

  - name: brave.news
    engine: brave
    network: brave
    shortcut: brn
    disabled: false
    brave_category: news
    categories: [news]

  - name: mojeek
    engine: mojeek
    shortcut: mjk
    disabled: false
    categories: [general, web]

  - name: qwant
    engine: qwant
    qwant_categ: web
    shortcut: qw
    disabled: false
    categories: [general, web]

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
    startpage_categ: web
    categories: [general, web]

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: google
    engine: google
    shortcut: go
    disabled: false # still works locally without API key

  - name: google images
    engine: google_images
    shortcut: goi
    disabled: false

  - name: google videos
    engine: google_videos
    shortcut: gov
    disabled: false

  - name: google news
    engine: google_news
    shortcut: gon
    disabled: false

  # Useful special engines
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    display_type: ["infobox"]

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false
    display_type: ["infobox"]

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    disabled: false

  - name: currency
    engine: currency_convert
    shortcut: cc
    disabled: false

  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    disabled: false

  # Everything else either disabled or left as-is (you can re-enable any you want)
  # Examples of engines that are now disabled (broken, limited, or dead in 2025):
  # - yahoo, yandex, baidu, marginalia, gigablast, etc.
  # Feel free to turn any back on from the original list if you need them.

# DOI resolvers (for scientific papers)
doi_resolvers:
  oadoi.org: "https://oadoi.org/"
  doi.org: "https://doi.org/"
  sci-hub.se: "https://sci-hub.se/"
  sci-hub.st: "https://sci-hub.st/"
  sci-hub.ru: "https://sci-hub.ru/"
default_doi_resolver: "sci-hub.se" # personal local preference
